# Example analysis of the ZX_test NANO (simulation/configs/ZX_test.yaml): kinematics and the unbinned EECs.
# Syntax: bvana/config.py, bvana/expr.py, bvana/histograms.py.

variables:
  tau21: jets.tau2 / jets.tau1
  dRjZ: deltaR(jets, boson)                     # jet-level
  ptBalance: jets.pt / boson.pt                 # jet-level

binning:
  zpt: {regular: [60, 0, 1200], label: 'Z $p_T$ [GeV]'}
  zmass: {regular: [60, 60, 122], label: '$m_{\ell\ell}$ [GeV]'}
  lpt: {regular: [50, 0, 1000], label: 'lepton $p_T$ [GeV]'}
  jetpt: {regular: [60, 200, 1400], label: 'jet $p_T$ [GeV]'}
  jetptSlices: {edges: [200, 300, 400, 600, 1000, 3000], label: 'jet $p_T$ [GeV]'}
  eta: {regular: [48, -2.4, 2.4], label: '$\eta$'}
  msd: {regular: [50, 0, 250], label: '$m_{SD}$ [GeV]'}
  unit: {regular: [50, 0, 1]}
  njet: {integer: [0, 6], label: 'number of jets'}
  dR: {log: [50, 1.0e-3, 1.0], label: '$\Delta R$'}
  theta: {regular: [40, 0, 3.141592653589793], label: '$\theta$'}
  logTheta: {log: [40, 1.0e-3, 1.0], label: '$\theta$ (jet axis)'}
  logDRProjective: {log: [40, 1.0e-3, 1.0], label: '$\Delta R$'}   # E1CProjective theta is the (eta, phi) distance to the jet axis
  phi: {regular: [40, -3.141592653589793, 3.141592653589793], label: '$\phi$'}

regions:
  ZmumuReco: {level: reco, channel: Zmumu}
  ZeeReco: {level: reco, channel: Zee}
  ZmumuGen:                        # the reco jet threshold; NANO gen jets start at 150 GeV (migration studies)
    level: gen
    channel: Zmumu
    cuts: [jets.pt >= 200, num(jets) >= 1]
  ZeeGen:                          # the reco jet threshold; NANO gen jets start at 150 GeV (migration studies)
    level: gen
    channel: Zee
    cuts: [jets.pt >= 200, num(jets) >= 1]
  ZmumuBoostedReco:
    level: reco
    channel: Zmumu
    cuts:
      - all(leptons.mediumId)          # lepton cut: every selected muon
      - boson.pt > 200
      - jets.pt > 200                  # jet cut: drops jets and their EEC entries
      - abs(jets.eta) < 2.0
      - num(jets) >= 1                 # event cut

anchors:
  recoRegions: &recoRegions [ZmumuReco, ZeeReco, ZmumuBoostedReco]   # reco-jet columns absent from GenJet

histograms:
  bosonPt: {axes: [{var: boson.pt, bins: zpt}]}
  bosonMass: {axes: [{var: boson.mass, bins: zmass}]}
  nJets: {axes: [{var: num(jets), bins: njet}]}
  leptonPt: {granularity: lepton, axes: [{var: leptons.pt, bins: lpt}]}
  jetPt: {granularity: jet, axes: [{var: jets.pt, bins: jetpt}]}
  jetEta: {granularity: jet, axes: [{var: jets.eta, bins: eta}]}
  jetMsd: {granularity: jet, axes: [{var: jets.msoftdrop, bins: msd}], regions: *recoRegions}
  jetTau21: {granularity: jet, axes: [{var: tau21, bins: unit}], regions: *recoRegions}
  jetWvsQCD: {granularity: jet, axes: [{var: jets.globalParT3_WvsQCD, bins: unit}], regions: *recoRegions}
  E2Cn1:
    granularity: eec:E2Cn1
    cuts: [eec.dR > 0]                 # drop the self-pair (dR = 0) entries
    axes: [{var: eec.dR, bins: dR, name: dR}, {var: jets.pt, bins: jetptSlices, name: jetpt}]
  E2Cn2:
    granularity: eec:E2Cn2
    cuts: [eec.dR > 0]
    axes: [{var: eec.dR, bins: dR, name: dR}, {var: jets.pt, bins: jetptSlices, name: jetpt}]
  E1CLab:
    granularity: eec:E1CLab
    axes: [{var: eec.theta, bins: logTheta, name: theta}, {var: eec.phi, bins: phi, name: phi}]
  E1CHelicity:                        # jet rest frame, boosted offline from E1CLab (bvana/frames.py)
    granularity: eec:E1CLab
    restFrame: {axis: jet, mass: axis}
    axes: [{var: eec.thetaRest, bins: theta, name: theta}, {var: eec.phiRest, bins: phi, name: phi}]
  E1CCS:
    granularity: eec:E1CCS
    axes: [{var: eec.theta, bins: theta, name: theta}, {var: eec.phi, bins: phi, name: phi}]
  E1CProjective:
    granularity: eec:E1CProjective
    axes: [{var: eec.theta, bins: logDRProjective, name: theta}, {var: eec.phi, bins: phi, name: phi}]
