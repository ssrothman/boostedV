# Second ZX_test production: ZZ/WZ -> 2l2q and high-pT Z+jets, with the dilepton pT > 150 GeV and back-to-back jet
# selections (ZX_test.yaml as of 2026-11-14). TT is not rerun.
# Splitting from local timing on 2026-11-15 (ZX_test, Summer22EE DY MLM): about 42 ms/event for PTLL-400to600 events
# and 5 ms/event for inclusive ones, after a 28 s start-up. Grid jobs ran 1.3-2x slower than local in 20261113_zxtest.
# Peak RSS 1.9 GB locally (CRAB maxMemoryMB 3000).
outputBase: /store/user/srothman/boostedV
storageSite: T3_US_FNALLPC
eosRedirector: root://cmseos.fnal.gov
inputRedirector: root://cmsxrootd.fnal.gov

samples:
  ZZto2L2Q_powheg:                # 49.1M events, 891 files (55k/file); mostly low-pT Z: ~330k events/job
    input: {dataset: /ZZto2L2Q_TuneCP5_13p6TeV_powheg-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v2/MINIAODSIM}
    isMC: true
    globalTag: 130X_mcRun3_2022_realistic_postEE_v6
    config: ../configs/ZX_test.yaml
    lumiMask: ''
    backend: crab
    splitting: {mode: files, unitsPerJob: 6}
    maxJobs: -1
  WZto2L2Q_powheg:                # 15.0M events, 278 files (54k/file): ~320k events/job
    input: {dataset: /WZto2L2Q_TuneCP5_13p6TeV_powheg-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v2/MINIAODSIM}
    isMC: true
    globalTag: 130X_mcRun3_2022_realistic_postEE_v6
    config: ../configs/ZX_test.yaml
    lumiMask: ''
    backend: crab
    splitting: {mode: files, unitsPerJob: 6}
    maxJobs: -1
  DYto2L-4Jets_MLL-50_PTLL-200to400_MLM:   # 6.44M events, 286 files (22.5k/file); every event high pT: ~90k events/job
    input: {dataset: /DYto2L-4Jets_MLL-50_PTLL-200to400_TuneCP5_13p6TeV_madgraphMLM-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v3/MINIAODSIM}
    isMC: true
    globalTag: 130X_mcRun3_2022_realistic_postEE_v6
    config: ../configs/ZX_test.yaml
    lumiMask: ''
    backend: crab
    splitting: {mode: files, unitsPerJob: 4}
    maxJobs: -1
  DYto2L-4Jets_MLL-50_PTLL-400to600_MLM:   # 3.67M events, 180 files (20k/file): ~80k events/job
    input: {dataset: /DYto2L-4Jets_MLL-50_PTLL-400to600_TuneCP5_13p6TeV_madgraphMLM-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v3/MINIAODSIM}
    isMC: true
    globalTag: 130X_mcRun3_2022_realistic_postEE_v6
    config: ../configs/ZX_test.yaml
    lumiMask: ''
    backend: crab
    splitting: {mode: files, unitsPerJob: 4}
    maxJobs: -1
  DYto2L-4Jets_MLL-50_PTLL-600_MLM:        # 3.23M events, 186 files (17k/file): ~70k events/job
    input: {dataset: /DYto2L-4Jets_MLL-50_PTLL-600_TuneCP5_13p6TeV_madgraphMLM-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v3/MINIAODSIM}
    isMC: true
    globalTag: 130X_mcRun3_2022_realistic_postEE_v6
    config: ../configs/ZX_test.yaml
    lumiMask: ''
    backend: crab
    splitting: {mode: files, unitsPerJob: 4}
    maxJobs: -1
