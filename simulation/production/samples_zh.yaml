# ZH (qq and gg) with Z -> ll, H -> bb, cc, gg, WW -> 4q and WW -> lnu2q, Summer22EE, mH = 125. Config ZX_test.yaml as in
# samples_zxb2b.yaml. Base datasets only (bb and cc also have an _ext1 with ~6x more events, not run).
# Splitting: ~300k events/job (as samples_zxb2b_bkg.yaml), at most a third of the files per job so that the small samples
# (0.10-0.25M events) still give 3 jobs.
outputBase: /store/user/srothman/boostedV
storageSite: T3_US_FNALLPC
eosRedirector: root://cmseos.fnal.gov
inputRedirector: root://cmsxrootd.fnal.gov

samples:
  ZH_Hto2B_Zto2L_powheg:
    input: {dataset: /ZH_Hto2B_Zto2L_M-125_TuneCP5_13p6TeV_powheg-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v2/MINIAODSIM}   # 2.06M events, 60 files (34k/file): ~309k events/job, 7 jobs
    isMC: true
    globalTag: 130X_mcRun3_2022_realistic_postEE_v6
    config: ../configs/ZX_test.yaml
    lumiMask: ''
    backend: crab
    splitting: {mode: files, unitsPerJob: 9}
    maxJobs: -1
