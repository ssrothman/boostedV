# Full ZX_test production with the current code (review 2: extra-lepton veto, 150 GeV gen jets, goodVertex boundaries;
# alternative jet axes, per-axis lab E1C, truth axis with gamma/Z/W/H bosons and the parton fallback). All samples of
# samples_zxb2b.yaml (ZZ/WZ -> 2l2q, DY PTLL 200-400/400-600/600), samples_zxb2b_bkg.yaml (TTto2L2Nu, WW, single top) and
# samples_zh.yaml (qq/gg -> ZH), with their splitting; nominal datasets only (no _ext1). Inputs of the analysis, the
# exact final cutflow rows, AN Appendix B (axes at high statistics) and its QCD (DY) and Higgs (ZH) versions of the
# axis-distance figure. The axes add CPU time (ZZ locally ~21 ms/event with this config, 2026-11-18).
outputBase: /store/user/srothman/boostedV
storageSite: T3_US_FNALLPC
eosRedirector: root://cmseos.fnal.gov
inputRedirector: root://cmsxrootd.fnal.gov

samples:
  ZZto2L2Q_powheg:                # 49.1M events, 891 files (55k/file); mostly low-pT Z: ~330k events/job
    input: {dataset: /ZZto2L2Q_TuneCP5_13p6TeV_powheg-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v2/MINIAODSIM}
