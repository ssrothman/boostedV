# Fourth ZX_test production: WW, single top (t-, tW-, s-channel) and TTto2L2Nu, to complete the background set of
# 20261116_zxb2b (DY, ZZ, WZ). Config ZX_test.yaml as in samples_zxb2b.yaml. TTto2L2Nu is rerun because the first
# production predates the dilepton pT > 200 GeV and back-to-back selections.
# Splitting: ~300k events/job (same as the ZZ/WZ/ttbar jobs of 20261113_zxtest/20261116_zxb2b); only base datasets
# (no _ext1), as in the earlier productions. t-channel is the 4FS powheg-madspin set.
outputBase: /store/user/srothman/boostedV
storageSite: T3_US_FNALLPC
eosRedirector: root://cmseos.fnal.gov
inputRedirector: root://cmsxrootd.fnal.gov

samples:
  TTto2L2Nu_powheg:
    input: {dataset: /TTto2L2Nu_TuneCP5_13p6TeV_powheg-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v2/MINIAODSIM}   # 74.30M events, 1388 files (54k/file): ~321k events/job
    isMC: true
    globalTag: 130X_mcRun3_2022_realistic_postEE_v6
    config: ../configs/ZX_test.yaml
    lumiMask: ''
    backend: crab
    splitting: {mode: files, unitsPerJob: 6}
    maxJobs: -1
