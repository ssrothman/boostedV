# Unselected LHE NANO (configs/lheNano_cfg.py: LHE tables and generator weights of every event) of the nominal
# Summer22EE ZZ/WZ -> 2l2q and DY PTLL-200to400/400to600/600 datasets, for the truth spin-density matrix (analysis/truthRho.py,
# AN Appendix A). config is required by the manifest but ignored by lheNano_cfg.py.
# Local timing (2026-11-18, ZZto2L2Q): about 0.5 ms/event after the file open (~1 min over xrootd); 147 bytes/event plus
# 2.4 MB per output file. 10 files per job: ~15 min and ~80 MB per ZZ job.
outputBase: /store/user/srothman/boostedV
storageSite: T3_US_FNALLPC
eosRedirector: root://cmseos.fnal.gov
inputRedirector: root://cmsxrootd.fnal.gov

samples:
  ZZto2L2Q_powheg:                         # 49.1M events, 891 files: 90 jobs
    input: {dataset: /ZZto2L2Q_TuneCP5_13p6TeV_powheg-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v2/MINIAODSIM}
    isMC: true
    globalTag: 130X_mcRun3_2022_realistic_postEE_v6
    config: ../configs/ZX_test.yaml
    cmsswConfig: lheNano_cfg.py
    lumiMask: ''
    backend: crab
    splitting: {mode: files, unitsPerJob: 10}
    maxJobs: -1
  WZto2L2Q_powheg:                         # 15.0M events, 278 files: 28 jobs
    input: {dataset: /WZto2L2Q_TuneCP5_13p6TeV_powheg-pythia8/Run3Summer22EEMiniAODv4-130X_mcRun3_2022_realistic_postEE_v6-v2/MINIAODSIM}
