# JSON Schema (draft-07) for the analysis configuration (e.g. default.yaml). Every object is closed
# (additionalProperties: false) and lists all of its keys as required. Cross-references between sections are
# checked in analysisConfig.py.
$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required: [inputs, selection, jets, observables, aggregation, output]

definitions:
  axisName: {type: string, pattern: '^axis[A-Z][A-Za-z0-9]*$'}
  str: {type: string, minLength: 1}
  strList: {type: array, items: {$ref: '#/definitions/str'}}
  intList: {type: array, items: {type: integer}}
  num: {type: number}
  jetId:                      # JME correctionlib jet ID: <type>_Tight (bit 0), <type>_TightLeptonVeto (bit 1)
    type: object
    additionalProperties: false
    required: [correctionFile, type]
    properties:
      correctionFile: {type: string}   # '' = no jet ID (bits 0)
      type: {$ref: '#/definitions/str'}
  uint: {type: integer, minimum: 0}

  neutrino:                  # strategy: the module type; the other keys are that module's parameters
    type: object
    required: [type]
    properties:
      type: {$ref: '#/definitions/str'}
    additionalProperties: {type: [number, string, boolean]}

  backToBack:                # leading non-vetoed jet back to back with and balanced against the channel's object
    type: object
    additionalProperties: false
    required: [enabled, dPhiMin, asymmetryMax, extraJetAlphaMax]
    properties:
      enabled: {type: boolean}
      dPhiMin: {type: number, minimum: 0, maximum: 3.141592653589793}
      asymmetryMax: {type: number, exclusiveMinimum: 0, maximum: 1}
      extraJetAlphaMax: {type: number}   # fail if an extraJets jet has pt >= this * pt_V (0: any); negative: disabled

  objectVariable:            # one column from a PAT string expression on a matched lepton or photon
    type: object
    additionalProperties: false
    required: [name, expr, type, doc, precision]
    properties:
      name: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]*$', not: {enum: [undressedPt, triggerMatched]}}
      expr: {$ref: '#/definitions/str'}
      type: {enum: [float, int, int16, uint8, bool]}
      doc: {type: string}
      precision: {type: integer}

  tableVariable:             # one column from a PAT string expression on the source object
    type: object
    additionalProperties: false
    required: [name, expr, type, doc, precision, mcOnly]
    properties:
      name: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]*$'}
      expr: {$ref: '#/definitions/str'}
      type: {enum: [float, int, int16, uint8, bool]}
      doc: {type: string}
      precision: {type: integer}
      mcOnly: {type: boolean}

  axis:
    oneOf:
      - type: object
        additionalProperties: false
        required: [type, nbins, lo, hi]
        properties:
          type: {enum: [regular, log]}
          nbins: {type: integer, minimum: 1}
          lo: {$ref: '#/definitions/num'}
          hi: {$ref: '#/definitions/num'}
      - type: object
        additionalProperties: false
        required: [type, edges]
        properties:
          type: {const: variable}
          edges: {type: array, items: {type: number}, minItems: 2}

  channel:
    oneOf:
      - type: object
        additionalProperties: false
        required: [type, triggers, allowMissingTriggers, objects, vetoes, leadPtMin, subleadPtMin, massMin, massMax,
                   oppositeCharge, targetMass, pairPtMin, backToBack]
        properties:
          type: {const: dilepton}
          triggers: {$ref: '#/definitions/strList', minItems: 1}
          allowMissingTriggers: {type: boolean}
          objects: {$ref: '#/definitions/str'}
          vetoes: {$ref: '#/definitions/strList'}   # any candidate not within dR 0.01 of the selected pair fails the event
          leadPtMin: {$ref: '#/definitions/num'}
          subleadPtMin: {$ref: '#/definitions/num'}
          massMin: {$ref: '#/definitions/num'}
          massMax: {$ref: '#/definitions/num'}
          oppositeCharge: {type: boolean}
          targetMass: {$ref: '#/definitions/num'}
          pairPtMin: {$ref: '#/definitions/num'}
          backToBack: {$ref: '#/definitions/backToBack'}
      - type: object
        additionalProperties: false
        required: [type, triggers, allowMissingTriggers, objects, vetoes, ptMin, metMin, mtMin, neutrino, backToBack]
        properties:
          type: {const: leptonMET}
          triggers: {$ref: '#/definitions/strList', minItems: 1}
          allowMissingTriggers: {type: boolean}
          objects: {$ref: '#/definitions/str'}
          vetoes: {$ref: '#/definitions/strList'}
          ptMin: {$ref: '#/definitions/num'}
          metMin: {$ref: '#/definitions/num'}
          mtMin: {$ref: '#/definitions/num'}
          neutrino: {$ref: '#/definitions/neutrino'}
          backToBack: {$ref: '#/definitions/backToBack'}
      - type: object
        additionalProperties: false
        required: [type, triggers, allowMissingTriggers, objects, vetoes, nMin, nMax, backToBack]
        properties:
          type: {const: singleObject}
          triggers: {$ref: '#/definitions/strList', minItems: 1}
          allowMissingTriggers: {type: boolean}
          objects: {$ref: '#/definitions/str'}
          vetoes: {$ref: '#/definitions/strList'}
          nMin: {$ref: '#/definitions/uint'}
          nMax: {$ref: '#/definitions/uint'}
          backToBack: {$ref: '#/definitions/backToBack'}

  genChannel:
    oneOf:
      - type: object
        additionalProperties: false
        required: [type, objects, vetoes, leadPtMin, subleadPtMin, massMin, massMax,
                   oppositeCharge, targetMass, pairPtMin, backToBack]
        properties:
          type: {const: dilepton}
          objects: {$ref: '#/definitions/str'}
          vetoes: {$ref: '#/definitions/strList'}
          leadPtMin: {$ref: '#/definitions/num'}
          subleadPtMin: {$ref: '#/definitions/num'}
          massMin: {$ref: '#/definitions/num'}
          massMax: {$ref: '#/definitions/num'}
          oppositeCharge: {type: boolean}
          targetMass: {$ref: '#/definitions/num'}
          pairPtMin: {$ref: '#/definitions/num'}
          backToBack: {$ref: '#/definitions/backToBack'}
      - type: object
        additionalProperties: false
        required: [type, objects, vetoes, ptMin, metMin, mtMin, neutrino, backToBack]
        properties:
          type: {const: leptonMET}
          objects: {$ref: '#/definitions/str'}
          vetoes: {$ref: '#/definitions/strList'}
          ptMin: {$ref: '#/definitions/num'}
          metMin: {$ref: '#/definitions/num'}
          mtMin: {$ref: '#/definitions/num'}
          neutrino: {$ref: '#/definitions/neutrino'}
          backToBack: {$ref: '#/definitions/backToBack'}
      - type: object
        additionalProperties: false
        required: [type, objects, vetoes, nMin, nMax, backToBack]
        properties:
          type: {const: singleObject}
          objects: {$ref: '#/definitions/str'}
          vetoes: {$ref: '#/definitions/strList'}
          nMin: {$ref: '#/definitions/uint'}
          nMax: {$ref: '#/definitions/uint'}
          backToBack: {$ref: '#/definitions/backToBack'}

  jetCuts:
    type: object
    additionalProperties: false
    required: [ptMin, absEtaMax, idMask, minConstituents]
    properties:
      ptMin: {$ref: '#/definitions/num'}
      absEtaMax: {$ref: '#/definitions/num'}
      idMask: {$ref: '#/definitions/uint'}
      minConstituents: {type: integer, minimum: 2}   # after constituentCuts

  constituentCuts:
    type: object
    additionalProperties: false
    required: [ptMin, chargedOnly, keepAbsPdgIds, dropAbsPdgIds, minPuppiWeight]
    properties:
      ptMin: {$ref: '#/definitions/num'}
      chargedOnly: {type: boolean}
      keepAbsPdgIds: {$ref: '#/definitions/intList'}
      dropAbsPdgIds: {$ref: '#/definitions/intList'}
      minPuppiWeight: {$ref: '#/definitions/num'}

  category: {enum: [chargedHadron, neutralHadron, photon, electron, muon, all]}

  variation:
    oneOf:
      - type: object
        additionalProperties: false
        required: [type, direction]
        properties:
          type: {enum: [jes, jer]}
          direction: {enum: [up, down]}
      - type: object
        additionalProperties: false
        required: [type, categories, scale]
        properties:
          type: {const: constScale}
          categories: {type: array, items: {$ref: '#/definitions/category'}, minItems: 1}
          scale: {type: number, minimum: 0}
      - type: object
        additionalProperties: false
        required: [type, categories, dropProbability, seedSalt]
        properties:
          type: {const: constDrop}
          categories: {type: array, items: {$ref: '#/definitions/category'}, minItems: 1}
          dropProbability: {type: number, minimum: 0, maximum: 1}
          seedSalt: {$ref: '#/definitions/uint'}
      - type: object
        additionalProperties: false
        required: [type]
        minProperties: 2
        properties:
          type: {const: cuts}
          jetCuts: {type: object}
          constituentCuts: {type: object}

  translator:
    oneOf:
      - type: object          # reco, pat
        additionalProperties: false
        required: [ptMin, applyPuppiWeights, puppiValueMap, jetId]
        properties:
          ptMin: {$ref: '#/definitions/num'}
          applyPuppiWeights: {type: boolean}
          puppiValueMap: {type: string}
          jetId: {$ref: '#/definitions/jetId'}
      - type: object          # gen, pat
        additionalProperties: false
        required: [ptMin]
        properties:
          ptMin: {$ref: '#/definitions/num'}
      - type: object          # event (EventEECJetProducer)
        additionalProperties: false
        required: [applyPuppiWeights, puppiValueMap, dropAbsPdgIds, absEtaMax, minFromPV, recoilHemisphere,
                   constituentDetails, extraSrcs]
        properties:
          applyPuppiWeights: {type: boolean}
          puppiValueMap: {type: string}
          dropAbsPdgIds: {$ref: '#/definitions/intList'}
          absEtaMax: {type: number, exclusiveMinimum: 0}
          minFromPV: {type: integer}        # charged candidates: fromPV() >= this; < 0: no cut
          recoilHemisphere: {type: boolean}
          constituentDetails: {type: boolean}   # reco: fromPV, dz, dxy, PUPPI weights per constituent
          extraSrcs: {$ref: '#/definitions/strList'}   # reco: more packed candidates after src, e.g. [lostTracks]
      - type: object          # recluster
        additionalProperties: false
        required: [ptMin, algorithm, applyPuppiWeights, puppiValueMap, dropAbsPdgIds]
        properties:
          ptMin: {$ref: '#/definitions/num'}
          algorithm: {enum: [antikt, kt, cambridge]}
          applyPuppiWeights: {type: boolean}
          puppiValueMap: {type: string}
          dropAbsPdgIds: {$ref: '#/definitions/intList'}

  collection:
    type: object
    additionalProperties: false
    required: [level, mode, mcOnly, src, translator, jetCuts, constituentCuts, cleaningDR, table]
    if: {properties: {mode: {enum: [pat, recluster]}}}
    then: {required: [R]}
    else: {not: {required: [R]}}    # event: one pseudo-jet per event, no radius
    properties:
      level: {enum: [reco, gen]}
      mode: {enum: [pat, recluster, event]}
      mcOnly: {type: boolean}
      src: {$ref: '#/definitions/str'}
      R: {type: number, exclusiveMinimum: 0}
      translator: {$ref: '#/definitions/translator'}
      jetCuts: {$ref: '#/definitions/jetCuts'}
      constituentCuts: {$ref: '#/definitions/constituentCuts'}
      cleaningDR: {$ref: '#/definitions/num'}
      retag:
        type: object
        additionalProperties: false
        required: [taggers, vertices, secondaryVertices, jecPayload, variables]
        properties:
          taggers: {type: array, uniqueItems: true, items: {enum: [GlobalParT]}}
          vertices: {$ref: '#/definitions/str'}
          secondaryVertices: {$ref: '#/definitions/str'}
          jecPayload: {$ref: '#/definitions/str'}
          variables: {type: array, items: {$ref: '#/definitions/tableVariable'}}
      table:
        type: object
        additionalProperties: false
        required: [name, precision, extraVariables]
        properties:
          name: {$ref: '#/definitions/str'}
          precision: {type: integer}
          extraVariables: {type: array, items: {$ref: '#/definitions/tableVariable'}}
      jerc:
        type: object
        additionalProperties: false
        required: [correctionFile, jesKey, jerScaleFactorKey, jerScaleFactorUncertaintyKey, jerResolutionKey, rho, genJets,
                   jerSeedSalt]
        properties:
          correctionFile: {$ref: '#/definitions/str'}
          jesKey: {$ref: '#/definitions/str'}
          jerScaleFactorKey: {$ref: '#/definitions/str'}
          jerScaleFactorUncertaintyKey: {$ref: '#/definitions/str'}
          jerResolutionKey: {$ref: '#/definitions/str'}
          rho: {$ref: '#/definitions/str'}
          genJets: {$ref: '#/definitions/str'}
          jerSeedSalt: {$ref: '#/definitions/uint'}
      jec:
        type: object
        additionalProperties: false
        required: [correctionFile, mcKey, dataKey, rho]
        properties:
          correctionFile: {$ref: '#/definitions/str'}
          mcKey: {$ref: '#/definitions/str'}
          dataKey: {$ref: '#/definitions/str'}
          rho: {$ref: '#/definitions/str'}
      variations:
        type: object
        additionalProperties: {$ref: '#/definitions/variation'}
      axes:                  # nominal jets only; all constituents, before constituentCuts
        type: object
        additionalProperties: false
        required: [definitions]
        properties:
          definitions:
            type: array
            items:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [name, type, beta, zcut, R0, corrected]
                  properties:
                    name: {$ref: '#/definitions/axisName'}
                    type: {const: softDrop}
                    beta: {type: number, minimum: 0}
                    zcut: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 0.5}
                    R0: {type: number, exclusiveMinimum: 0}
                    corrected: {type: boolean}   # subjetJec (and subjetJer in MC) on each subjet
                - type: object
                  additionalProperties: false
                  required: [name, type, Rsub, fcut]
                  properties:
                    name: {$ref: '#/definitions/axisName'}
                    type: {const: trimming}
                    Rsub: {type: number, exclusiveMinimum: 0}
                    fcut: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
                - type: object
                  additionalProperties: false
                  required: [name, type, algorithm]
                  properties:
                    name: {$ref: '#/definitions/axisName'}
                    type: {const: wta}
                    algorithm: {enum: [ca, kt]}
                - type: object
                  additionalProperties: false
                  required: [name, type]
                  properties:
                    name: {$ref: '#/definitions/axisName'}
                    type: {enum: [recoil, truth]}
          subjetJec:           # reco only: correctionlib compound JEC of the subjets
            type: object
            additionalProperties: false
            required: [correctionFile, mcKey, dataKey, rho]
            properties:
              correctionFile: {$ref: '#/definitions/str'}
              mcKey: {$ref: '#/definitions/str'}
              dataKey: {$ref: '#/definitions/str'}
              rho: {$ref: '#/definitions/str'}
          subjetJer:           # reco only, applied in MC: AK4 hybrid JER of each corrected subjet
            type: object
            additionalProperties: false
            required: [correctionFile, scaleFactorKey, resolutionKey, genSubjets, R, seedSalt]
            properties:
              correctionFile: {$ref: '#/definitions/str'}
              scaleFactorKey: {$ref: '#/definitions/str'}
              resolutionKey: {$ref: '#/definitions/str'}
              genSubjets: {$ref: '#/definitions/str'}
              R: {type: number, exclusiveMinimum: 0}   # gen match dR < R/2
              seedSalt: {$ref: '#/definitions/uint'}

  observable:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind, N, n, weight, angle, norm, output, table]
        properties:
          kind: {const: penc}
          N: {type: integer, minimum: 2, maximum: 6}
          n: {$ref: '#/definitions/num'}
          weight: {enum: [Energy, Pt, Charge]}   # charge weights: DeltaR only
          angle: {enum: [DeltaR, Angle3D]}
          norm: {enum: [sumE, sumPt, jetE, jetPt, unity]}
          output: {enum: [Dense, SparseMerged, SparseUnmerged, Unbinned]}
          axes: {type: array, items: {$ref: '#/definitions/axis'}, minItems: 1, maxItems: 1}
          collections: {$ref: '#/definitions/strList'}   # default: every jet collection
          table: {$ref: '#/definitions/obsTable'}
      - type: object
        additionalProperties: false
        required: [kind, n, weight, frame, norm, output, table]
        properties:
          kind: {const: e1c}
          n: {$ref: '#/definitions/num'}
          weight: {enum: [Energy, Pt, Charge]}
          frame: {enum: [lab, jetAxis, jetHelicity, jetCS, jetProjective]}
          norm: {enum: [sumE, sumPt, jetE, jetPt, unity]}
          output: {enum: [Dense, SparseMerged, SparseUnmerged, Unbinned]}
          axes: {type: array, items: {$ref: '#/definitions/axis'}, minItems: 2, maxItems: 2}
          axis: {$ref: '#/definitions/axisName'}   # frame jetAxis about this jet axis; nominal jets only
          collections: {$ref: '#/definitions/strList'}   # default: every jet collection
          table: {$ref: '#/definitions/obsTable'}

  obsTable:
    type: object
    additionalProperties: false
    required: [weightPrecision]
    properties:
      weightPrecision: {type: integer}
      coordPrecision: {type: integer}
      coordNames: {$ref: '#/definitions/strList'}

properties:
  inputs:
    type: object
    additionalProperties: false
    required: [eras, muons, electrons, photons, pfCandidates, met, vertices, secondaryVertices, genEventInfo, lheInfo, genVertex,
               pileupInfo, hltProcess, triggerObjects,
               metFilterProcess, prunedGenParticles, packedGenParticles]
    properties:
      eras: {type: array, items: {$ref: '#/definitions/str'}, minItems: 1}
      muons: {$ref: '#/definitions/str'}
      electrons: {$ref: '#/definitions/str'}
      photons: {$ref: '#/definitions/str'}
      pfCandidates: {$ref: '#/definitions/str'}
      met: {$ref: '#/definitions/str'}
      vertices: {$ref: '#/definitions/str'}
      genEventInfo: {$ref: '#/definitions/str'}
      secondaryVertices: {$ref: '#/definitions/str'}
      genVertex: {$ref: '#/definitions/str'}
      pileupInfo: {$ref: '#/definitions/str'}
      lheInfo: {$ref: '#/definitions/strList'}
      hltProcess: {$ref: '#/definitions/str'}
      triggerObjects: {$ref: '#/definitions/str'}
      metFilterProcess: {$ref: '#/definitions/str'}
      prunedGenParticles: {$ref: '#/definitions/str'}
      packedGenParticles: {$ref: '#/definitions/str'}
  selection:
    type: object
    additionalProperties: false
    required: [levels, reco, gen]
    properties:
      levels:
        type: array
        items: {enum: [reco, gen]}
        minItems: 1
        uniqueItems: true
      reco:
        type: object
        additionalProperties: false
        required: [vertex, metFilters, ecalBadCalib, jetVetoMap, extraJets, metCorrections, muonCorrections,
                   muonScaleFactors, objectTables, dressing, objects, channels]
        properties:
          extraJets:             # AK4 jets of the extra-jet veto (backToBack.extraJetAlphaMax)
            type: object
            additionalProperties: false
            required: [src, rho, jec, jetId, jer, idMask, ptMin, absEtaMax, dRJet, dRLepton]
            properties:
              src: {$ref: '#/definitions/str'}
              rho: {$ref: '#/definitions/str'}
              jec:
                type: object
                additionalProperties: false
                required: [correctionFile, mcKey, dataKey]
                properties:
                  correctionFile: {$ref: '#/definitions/str'}
                  mcKey: {$ref: '#/definitions/str'}
                  dataKey: {$ref: '#/definitions/str'}
              jetId: {$ref: '#/definitions/jetId'}
              jer:                 # MC only: nominal hybrid smearing
                type: object
                additionalProperties: false
                required: [genJets, scaleFactorKey, scaleFactorUncertaintyKey, resolutionKey, seedSalt]
                properties:
                  genJets: {$ref: '#/definitions/str'}
                  scaleFactorKey: {$ref: '#/definitions/str'}
                  scaleFactorUncertaintyKey: {$ref: '#/definitions/str'}
                  resolutionKey: {$ref: '#/definitions/str'}
                  seedSalt: {type: integer, minimum: 0}
              idMask: {type: integer, minimum: 0, maximum: 3}
              ptMin: {$ref: '#/definitions/num'}
              absEtaMax: {$ref: '#/definitions/num'}
              dRJet: {$ref: '#/definitions/num'}     # ignore jets within this of the back-to-back jet
              dRLepton: {$ref: '#/definitions/num'}  # ignore jets within this of the channel's selected objects
          ecalBadCalib:          # rerun of EcalBadCalibFilter on these crystals; [] = not run
            type: object
            additionalProperties: false
            required: [recHits, minEt, crystals]
            properties:
              recHits: {$ref: '#/definitions/str'}
              minEt: {$ref: '#/definitions/num'}
              crystals: {$ref: '#/definitions/intList'}
          jetVetoMap:
            type: object
            additionalProperties: false
            required: [src, rho, jec, jetId, correctionFile, key, mapType, ptMin, emFractionMax]
            properties:
              src: {$ref: '#/definitions/str'}
              rho: {$ref: '#/definitions/str'}
              jec:
                type: object
                additionalProperties: false
                required: [correctionFile, mcKey, dataKey]
                properties:
                  correctionFile: {$ref: '#/definitions/str'}
                  mcKey: {$ref: '#/definitions/str'}
                  dataKey: {$ref: '#/definitions/str'}
              jetId: {$ref: '#/definitions/jetId'}
              correctionFile: {$ref: '#/definitions/str'}
              key: {$ref: '#/definitions/str'}
              mapType: {$ref: '#/definitions/str'}
              ptMin: {$ref: '#/definitions/num'}
              emFractionMax: {$ref: '#/definitions/num'}
          metCorrections:        # Type-1 PUPPI MET with the V4 AK4 JEC, optional XY shift and muon propagation
            type: object
            additionalProperties: false
            required: [apply, type1, xy, muons]
            properties:
              apply: {type: boolean}
              type1:
                type: object
                additionalProperties: false
                required: [jets, rho, correctionFile, l1McKey, l1DataKey, mcKey, dataKey, ptMin, absEtaMax, emFractionMax, jer]
                properties:
                  jets: {$ref: '#/definitions/str'}
                  rho: {$ref: '#/definitions/str'}
                  correctionFile: {$ref: '#/definitions/str'}
                  l1McKey: {$ref: '#/definitions/str'}
                  l1DataKey: {$ref: '#/definitions/str'}
                  mcKey: {$ref: '#/definitions/str'}
                  dataKey: {$ref: '#/definitions/str'}
                  ptMin: {$ref: '#/definitions/num'}
                  absEtaMax: {$ref: '#/definitions/num'}
                  emFractionMax: {$ref: '#/definitions/num'}
                  jer:
                    type: object
                    additionalProperties: false
                    required: [enabled, genJets, scaleFactorKey, scaleFactorUncertaintyKey, resolutionKey, seedSalt]
                    properties:
                      enabled: {type: boolean}
                      genJets: {$ref: '#/definitions/str'}
                      scaleFactorKey: {$ref: '#/definitions/str'}
                      scaleFactorUncertaintyKey: {$ref: '#/definitions/str'}
                      resolutionKey: {$ref: '#/definitions/str'}
                      seedSalt: {$ref: '#/definitions/uint'}
              xy:
                type: object
                additionalProperties: false
                required: [enabled, correctionFile, metType, epoch, variation]
                properties:
                  enabled: {type: boolean}
                  correctionFile: {$ref: '#/definitions/str'}
                  metType: {$ref: '#/definitions/str'}
                  epoch: {$ref: '#/definitions/str'}
                  variation: {$ref: '#/definitions/str'}
              muons:
                type: object
                additionalProperties: false
                required: [propagate]
                properties:
                  propagate: {type: boolean}
          muonCorrections:
            type: object
            additionalProperties: false
            required: [apply, momentum, regimeThreshold, correctionFile, lowPtThreshold, highPtThreshold, variation,
                       resolutionVariationK, highPt]
            properties:
              apply: {type: boolean}
              momentum: {enum: [pf, tuneP, hybrid]}
              regimeThreshold: {$ref: '#/definitions/num'}
              correctionFile: {$ref: '#/definitions/str'}
              lowPtThreshold: {$ref: '#/definitions/num'}
              highPtThreshold: {$ref: '#/definitions/num'}
              resolutionVariationK: {enum: [cpp, python]}
              variation: {enum: [nominal, scaleUp, scaleDown, resolutionUp, resolutionDown, highPtScaleUp,
                                 highPtScaleDown, highPtResolution]}
              highPt:
                type: object
                additionalProperties: false
                required: [era, ptMin, kappaTarget]
                properties:
                  era: {enum: [2022preEE, 2022postEE, 2023preBPix, 2023postBPix]}
                  ptMin: {$ref: '#/definitions/num'}
                  kappaTarget: {enum: [mc, data]}
          objectTables:
            type: object
            additionalProperties: false
            required: [muons, electrons, photons]
            properties:
              muons: {type: array, items: {$ref: '#/definitions/objectVariable'}}
              electrons: {type: array, items: {$ref: '#/definitions/objectVariable'}}
              photons: {type: array, items: {$ref: '#/definitions/objectVariable'}}
          muonScaleFactors:
            type: object
            additionalProperties:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [name, regime, file, key, trigger, paths, outOfRange]
                properties:
                  name: {type: string, pattern: '^[A-Za-z][A-Za-z0-9]*$'}
                  regime: {enum: [medium, high]}
                  file: {$ref: '#/definitions/str'}
                  key: {$ref: '#/definitions/str'}
                  trigger: {type: boolean}
                  paths: {type: array, items: {$ref: '#/definitions/str'}}
                  outOfRange: {enum: [error, skip]}
          dressing:
            type: object
            additionalProperties: false
            required: [mode, fsr, cone]
            properties:
              mode: {enum: [none, fsr, cone]}
              fsr:
                type: object
                additionalProperties: false
                required: [muonPtMin, muonEtaMax, elePtMin, eleEtaMax, photonPtMin, deltaROverEt2Max, isolation]
                properties:
                  muonPtMin: {$ref: '#/definitions/num'}
                  muonEtaMax: {$ref: '#/definitions/num'}
                  elePtMin: {$ref: '#/definitions/num'}
                  eleEtaMax: {$ref: '#/definitions/num'}
                  photonPtMin: {$ref: '#/definitions/num'}
                  deltaROverEt2Max: {$ref: '#/definitions/num'}
                  isolation: {$ref: '#/definitions/num'}
              cone:
                type: object
                additionalProperties: false
                required: [coneSize, photonPtMin, applyPuppiWeights]
                properties:
                  coneSize: {type: number, exclusiveMinimum: 0}
                  photonPtMin: {$ref: '#/definitions/num'}
                  applyPuppiWeights: {type: boolean}
          vertex:
            type: object
            additionalProperties: false
            required: [ndofMin, absZMax, rhoMax]
            properties:
              ndofMin: {$ref: '#/definitions/num'}
              absZMax: {$ref: '#/definitions/num'}
              rhoMax: {$ref: '#/definitions/num'}
          metFilters: {$ref: '#/definitions/strList', minItems: 1}
          objects:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required: [source, cut, dressedCut]
              properties:
                source: {enum: [muons, electrons, photons]}
                cut: {$ref: '#/definitions/str'}
                dressedCut: {type: string}
          channels:
            type: object
            minProperties: 1
            additionalProperties: {$ref: '#/definitions/channel'}
      gen:
        type: object
        additionalProperties: false
        required: [particleLevel, extraJets, objects, channels]
        properties:
          extraJets:             # gen jets of the extra-jet veto (backToBack.extraJetAlphaMax)
            type: object
            additionalProperties: false
            required: [src, ptMin, absEtaMax, dRJet, dRLepton]
            properties:
              src: {$ref: '#/definitions/str'}
              ptMin: {$ref: '#/definitions/num'}
              absEtaMax: {$ref: '#/definitions/num'}
              dRJet: {$ref: '#/definitions/num'}
              dRLepton: {$ref: '#/definitions/num'}
          particleLevel:
            type: object
            additionalProperties: false
            required: [usePromptFinalStates, particleMinPt, particleMaxEta, lepConeSize, lepMinPt, lepMaxEta,
                       phoIsoConeSize, phoMaxRelIso, phoMinPt, phoMaxEta]
            properties:
              usePromptFinalStates: {type: boolean}
              particleMinPt: {$ref: '#/definitions/num'}
              particleMaxEta: {$ref: '#/definitions/num'}
              lepConeSize: {$ref: '#/definitions/num'}
              lepMinPt: {$ref: '#/definitions/num'}
              lepMaxEta: {$ref: '#/definitions/num'}
              phoIsoConeSize: {$ref: '#/definitions/num'}
              phoMaxRelIso: {$ref: '#/definitions/num'}
              phoMinPt: {$ref: '#/definitions/num'}
              phoMaxEta: {$ref: '#/definitions/num'}
          objects:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required: [source, cut]
              properties:
                source: {enum: [leptons, photons]}
                cut: {$ref: '#/definitions/str'}
          channels:
            type: object
            minProperties: 1
            additionalProperties: {$ref: '#/definitions/genChannel'}
  jets:
    type: object
    additionalProperties: false
    required: [cleaning, collections]
    properties:
      cleaning:
        type: object
        additionalProperties: false
        required: [channels]
        properties:
          channels: {$ref: '#/definitions/strList'}
      collections:
        type: object
        minProperties: 1
        additionalProperties: {$ref: '#/definitions/collection'}
  observables:
    type: object
    minProperties: 1
    additionalProperties: {$ref: '#/definitions/observable'}
  aggregation:
    type: object
    additionalProperties: false
    required: [channels, observables, maxBins]
    properties:
      channels: {$ref: '#/definitions/strList'}
      observables: {$ref: '#/definitions/strList'}
      maxBins: {type: integer, minimum: 1}
  output:
    type: object
    additionalProperties: false
    required: [keepHLTBits, mcEventTables, lheTables, metTables, vertexTables, rhoTable, genParticles, pileupWeights, ak4Jets]
    properties:
      keepHLTBits: {type: boolean}
      mcEventTables: {type: boolean}
      lheTables: {type: boolean}
      metTables:
        type: object
        propertyNames: {pattern: '^[A-Z][A-Za-z0-9]*$'}
        additionalProperties: {$ref: '#/definitions/str'}
      vertexTables: {type: boolean}
      rhoTable: {type: array, items: {enum: [fixedGridRhoAll, fixedGridRhoFastjetAll, fixedGridRhoFastjetCentralNeutral,
                                             fixedGridRhoFastjetCentralCalo, fixedGridRhoFastjetCentral,
                                             fixedGridRhoFastjetCentralChargedPileUp]}, uniqueItems: true}
      genParticles: {type: boolean}
      pileupWeights:
        type: object
        additionalProperties: false
        required: [file, key]
        properties:
          file: {type: string}
          key: {type: string}
      ak4Jets:
        type: object
        additionalProperties: false
        required: [enabled, name, src, rho, cut, jetId, jec, variables]
        properties:
          enabled: {type: boolean}
          name: {type: string, pattern: '^[A-Z][A-Za-z0-9]*$'}
          src: {$ref: '#/definitions/str'}
          rho: {$ref: '#/definitions/str'}
          cut: {type: string}
          jetId: {$ref: '#/definitions/jetId'}
          jec:
            type: object
            additionalProperties: false
            required: [correctionFile, mcKey, dataKey, uncKey]
            properties:
              correctionFile: {$ref: '#/definitions/str'}
              mcKey: {$ref: '#/definitions/str'}
              dataKey: {$ref: '#/definitions/str'}
              uncKey: {type: string}
          variables: {type: array, items: {$ref: '#/definitions/tableVariable'}}
