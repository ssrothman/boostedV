          - {name: rawFactor, type: float, precision: 10, mcOnly: false, doc: '1 - factor to get back to raw pt',
             expr: '1.-jecFactor(''Uncorrected'')'}
          - {name: tau1, type: float, precision: 10, mcOnly: false, doc: 'N-subjettiness (1 axis)',
             expr: 'userFloat(''NjettinessAK8Puppi:tau1'')'}
          - {name: tau2, type: float, precision: 10, mcOnly: false, doc: 'N-subjettiness (2 axis)',
             expr: 'userFloat(''NjettinessAK8Puppi:tau2'')'}
          - {name: tau3, type: float, precision: 10, mcOnly: false, doc: 'N-subjettiness (3 axis)',
             expr: 'userFloat(''NjettinessAK8Puppi:tau3'')'}
          - {name: tau4, type: float, precision: 10, mcOnly: false, doc: 'N-subjettiness (4 axis)',
             expr: 'userFloat(''NjettinessAK8Puppi:tau4'')'}
          - {name: n2b1, type: float, precision: 10, mcOnly: false, doc: 'N2 with beta=1 (raw pt > 250)',
             expr: '?hasUserFloat(''nb1AK8PuppiSoftDrop:ecfN2'')?userFloat(''nb1AK8PuppiSoftDrop:ecfN2''):-99999.'}
          - {name: n3b1, type: float, precision: 10, mcOnly: false, doc: 'N3 with beta=1 (raw pt > 250)',
             expr: '?hasUserFloat(''nb1AK8PuppiSoftDrop:ecfN3'')?userFloat(''nb1AK8PuppiSoftDrop:ecfN3''):-99999.'}
          - {name: msoftdrop, type: float, precision: 10, mcOnly: false, doc: 'corrected soft-drop mass (PUPPI)',
             expr: 'groomedMass(''SoftDropPuppi'')'}
          - {name: particleNetWithMass_QCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet (w/ mass) QCD sum',
             expr: 'bDiscriminator(''pfParticleNetJetTags:probQCDbb'')+bDiscriminator(''pfParticleNetJetTags:probQCDcc'')+bDiscriminator(''pfParticleNetJetTags:probQCDb'')+bDiscriminator(''pfParticleNetJetTags:probQCDc'')+bDiscriminator(''pfParticleNetJetTags:probQCDothers'')'}
          - {name: particleNetWithMass_TvsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet (w/ mass) TvsQCD',
             expr: 'bDiscriminator(''pfParticleNetDiscriminatorsJetTags:TvsQCD'')'}
          - {name: particleNetWithMass_WvsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet (w/ mass) WvsQCD',
             expr: 'bDiscriminator(''pfParticleNetDiscriminatorsJetTags:WvsQCD'')'}
          - {name: particleNetWithMass_ZvsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet (w/ mass) ZvsQCD',
             expr: 'bDiscriminator(''pfParticleNetDiscriminatorsJetTags:ZvsQCD'')'}
          - {name: particleNetWithMass_H4qvsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet (w/ mass) H4qvsQCD',
             expr: 'bDiscriminator(''pfParticleNetDiscriminatorsJetTags:H4qvsQCD'')'}
          - {name: particleNetWithMass_HbbvsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet (w/ mass) HbbvsQCD',
             expr: 'bDiscriminator(''pfParticleNetDiscriminatorsJetTags:HbbvsQCD'')'}
          - {name: particleNetWithMass_HccvsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet (w/ mass) HccvsQCD',
             expr: 'bDiscriminator(''pfParticleNetDiscriminatorsJetTags:HccvsQCD'')'}
          - {name: particleNet_QCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet QCD (0+1+2 HF) sum',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8JetTags:probQCD2hf'')+bDiscriminator(''pfParticleNetFromMiniAODAK8JetTags:probQCD1hf'')+bDiscriminator(''pfParticleNetFromMiniAODAK8JetTags:probQCD0hf'')'}
          - {name: particleNet_QCD2HF, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet QCD 2HF score',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8JetTags:probQCD2hf'')'}
          - {name: particleNet_QCD1HF, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet QCD 1HF score',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8JetTags:probQCD1hf'')'}
          - {name: particleNet_QCD0HF, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet QCD 0HF score',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8JetTags:probQCD0hf'')'}
          - {name: particleNet_massCorr, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet mass regression, relative to the JEC-corrected mass',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8JetTags:masscorr'')'}
          - {name: particleNet_XbbVsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet Xbb vs QCD',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8DiscriminatorsJetTags:HbbvsQCD'')'}
          - {name: particleNet_XccVsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet Xcc vs QCD',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8DiscriminatorsJetTags:HccvsQCD'')'}
          - {name: particleNet_XqqVsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet Xqq vs QCD',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8DiscriminatorsJetTags:HqqvsQCD'')'}
          - {name: particleNet_XggVsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet Xgg vs QCD',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8DiscriminatorsJetTags:HggvsQCD'')'}
          - {name: particleNet_XttVsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet Xtt vs QCD',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8DiscriminatorsJetTags:HttvsQCD'')'}
          - {name: particleNet_XtmVsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet Xtm vs QCD',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8DiscriminatorsJetTags:HtmvsQCD'')'}
          - {name: particleNet_XteVsQCD, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet Xte vs QCD',
             expr: 'bDiscriminator(''pfParticleNetFromMiniAODAK8DiscriminatorsJetTags:HtevsQCD'')'}
          - {name: chHEF, type: float, precision: 10, mcOnly: false, doc: 'charged hadron energy fraction',
             expr: '?isPFJet()?chargedHadronEnergyFraction():-1'}
          - {name: neHEF, type: float, precision: 10, mcOnly: false, doc: 'neutral hadron energy fraction',
             expr: '?isPFJet()?neutralHadronEnergyFraction():-1'}
          - {name: chEmEF, type: float, precision: 10, mcOnly: false, doc: 'charged EM energy fraction',
             expr: '?isPFJet()?chargedEmEnergyFraction():-1'}
          - {name: neEmEF, type: float, precision: 10, mcOnly: false, doc: 'neutral EM energy fraction',
             expr: '?isPFJet()?neutralEmEnergyFraction():-1'}
          - {name: muEF, type: float, precision: 10, mcOnly: false, doc: 'muon energy fraction',
             expr: '?isPFJet()?muonEnergyFraction():-1'}
          - {name: chMultiplicity, type: int16, precision: -1, mcOnly: false, doc: '(PUPPI-weighted) charged multiplicity',
             expr: '?isPFJet()?chargedMultiplicity():-1'}
          - {name: neMultiplicity, type: int16, precision: -1, mcOnly: false, doc: '(PUPPI-weighted) neutral multiplicity',
             expr: '?isPFJet()?neutralMultiplicity():-1'}
          - {name: subJetIdx1, type: int16, precision: -1, mcOnly: false, doc: 'index of the first soft-drop subjet in the MiniAOD subjet collection',
             expr: '?nSubjetCollections()>0 && subjets(''SoftDropPuppi'').size()>0?subjets(''SoftDropPuppi'')[0].key():-1'}
          - {name: subJetIdx2, type: int16, precision: -1, mcOnly: false, doc: 'index of the second soft-drop subjet in the MiniAOD subjet collection',
             expr: '?nSubjetCollections()>0 && subjets(''SoftDropPuppi'').size()>1?subjets(''SoftDropPuppi'')[1].key():-1'}
          - {name: hadronFlavour, type: uint8, precision: -1, mcOnly: true, doc: 'hadron flavour (ghost tagging)',
             expr: 'hadronFlavour()'}
          - {name: partonFlavour, type: int16, precision: -1, mcOnly: true, doc: 'parton flavour',
             expr: 'partonFlavour()'}
          - {name: nBHadrons, type: uint8, precision: -1, mcOnly: true, doc: 'number of b-hadrons clustered in the jet',
             expr: 'jetFlavourInfo().getbHadrons().size()'}
          - {name: nCHadrons, type: uint8, precision: -1, mcOnly: true, doc: 'number of c-hadrons clustered in the jet',
             expr: 'jetFlavourInfo().getcHadrons().size()'}
      jerc:                  # MC only: nominal JER smearing and the JES/JER variations
        correctionFile: /cvmfs/cms-griddata.cern.ch/cat/metadata/JME/Run3-22EFGSep23-Summer22EE-NanoAODv12/latest/fatJet_jerc.json.gz
        jesKey: Summer22EE_22Sep2023_V4_MC_Total_AK8PFPuppi
        jerScaleFactorKey: Summer22EE_22Sep2023_JRV2_MC_ScaleFactor_AK8PFPuppi
        jerScaleFactorUncertaintyKey: Summer22EE_22Sep2023_JRV2_MC_SFUncertainty_AK8PFPuppi   # up/down: SF * (1 +- unc)
        jerResolutionKey: Summer22EE_22Sep2023_JRV2_MC_PtResolution_AK8PFPuppi
        rho: fixedGridRhoFastjetAll
        genJets: slimmedGenJetsAK8
        jerSeedSalt: 0
      variations: {}         # MC only; none for this test
    Gen:
      level: gen
      mode: pat
      mcOnly: true
      src: slimmedGenJetsAK8
      R: 0.8
      translator: {ptMin: 180.0}
      jetCuts: {ptMin: 200.0, absEtaMax: 2.4, idMask: 0, minConstituents: 2}
      constituentCuts: {ptMin: 0.0, chargedOnly: false, keepAbsPdgIds: [], dropAbsPdgIds: [], minPuppiWeight: 0.0}
      cleaningDR: 0.8
      table: {name: GenJet, precision: -1, extraVariables: []}

# Computed for every jet collection and variation; NANO tables are named <Collection><Variation><observable>.
observables:
  E2C:
    kind: penc
    N: 2
    n: 1.0
    weight: Pt               # Energy | Pt
    angle: DeltaR            # DeltaR | Angle3D
    norm: sumPt              # sumE | sumPt | jetE | jetPt | unity
    output: SparseMerged     # Dense | SparseMerged | SparseUnmerged | Unbinned
    axes: [{type: log, nbins: 50, lo: 0.001, hi: 1.0}]
    table: {weightPrecision: -1}
  E3C:
    kind: penc
    N: 3
    n: 1.0
    weight: Pt
    angle: DeltaR
    norm: sumPt
    output: SparseMerged
    axes: [{type: log, nbins: 50, lo: 0.001, hi: 1.0}]
    table: {weightPrecision: -1}
  E1C:
    kind: e1c
    n: 1.0
    weight: Pt
    frame: jetHelicity       # lab | jetHelicity | jetCS
    norm: sumPt
    output: SparseMerged
    axes:
      - {type: regular, nbins: 20, lo: 0.0, hi: 3.141592653589793}
      - {type: regular, nbins: 20, lo: -3.141592653589793, hi: 3.141592653589793}
    table: {weightPrecision: -1}

aggregation:                 # histograms with covariance, written to histFile
  channels: [Zmumu, Zee]     # one set per channel and enabled level, filled from events passing that channel at that
                             # level, for every jet collection: <channel>_<level>_eec<Collection><Variation><observable>
  observables: [E2C, E3C, E1C]
  maxBins: 5000              # memory guard for the covariance

output:
  keepHLTBits: true
  mcEventTables: true        # genWeights (Runs-tree sums), Pileup, Generator
  lheTables: true            # MC only: LHE (HT, Njets, Vpt, ...) and LHEPart (LHE particles), as in standard NanoAOD
  metTables:                 # table name: pat::MET label; each also gives Raw<name>; in MC also GenMET (from the first)
    MET: slimmedMETs           # type-1 PF MET (standard NanoAOD v12 name)
    PuppiMET: slimmedMETsPuppi
  vertexTables: true         # PV, OtherPV, SV; in MC also GenVtx
  rhoTable: [fixedGridRhoAll, fixedGridRhoFastjetAll, fixedGridRhoFastjetCentralNeutral, fixedGridRhoFastjetCentralCalo,
             fixedGridRhoFastjetCentral, fixedGridRhoFastjetCentralChargedPileUp]   # Rho table; [] disables
  genParticles: true         # MC only: GenPart with the standard NanoAOD pruning
  pileupWeights:             # MC only, needs mcEventTables: Pileup_weight{,Up,Down}; file '' disables
    file: /cvmfs/cms-griddata.cern.ch/cat/metadata/LUM/Run3-22EFGSep23-Summer22EE-NanoAODv12/latest/puWeights.json.gz
    key: Collisions2022_359022_362760_eraEFG_GoldenJson
  ak4Jets:                   # AK4 PUPPI jets, JECs re-applied in-job; not used by the selection or the EECs
    enabled: true
    name: AK4Jet
    src: slimmedJetsPuppi
    rho: fixedGridRhoFastjetAll
    cut: 'pt > 20 && abs(eta) < 4.7'   # on the re-corrected jets
    jetIdVersion: RUN3PUPPIruns2022FGruns2023CD
    jec:
      correctionFile: /cvmfs/cms-griddata.cern.ch/cat/metadata/JME/Run3-22EFGSep23-Summer22EE-NanoAODv12/latest/jet_jerc.json.gz
      mcKey: Summer22EE_22Sep2023_V4_MC_L1L2L3Res_AK4PFPuppi
      dataKey: Summer22EE_22Sep2023_V4_DATA_L1L2L3Res_AK4PFPuppi
      uncKey: Summer22EE_22Sep2023_V4_MC_Total_AK4PFPuppi   # '' = no jesUncTotal column
    variables:                 # built in: pt, eta, phi, mass, rawPt, jecFactor, jetId, srcIdx, jesUncTotal
      - {name: area, type: float, precision: 10, mcOnly: false, doc: 'jet catchment area',
         expr: 'jetArea()'}
      - {name: btagDeepFlavB, type: float, precision: 10, mcOnly: false, doc: 'DeepJet b+bb+lepb',
         expr: 'bDiscriminator(''pfDeepFlavourJetTags:probb'')+bDiscriminator(''pfDeepFlavourJetTags:probbb'')+bDiscriminator(''pfDeepFlavourJetTags:problepb'')'}
      - {name: btagDeepFlavCvL, type: float, precision: 10, mcOnly: false, doc: 'DeepJet c vs uds+g',
         expr: '?(bDiscriminator(''pfDeepFlavourJetTags:probc'')+bDiscriminator(''pfDeepFlavourJetTags:probuds'')+bDiscriminator(''pfDeepFlavourJetTags:probg''))>0?bDiscriminator(''pfDeepFlavourJetTags:probc'')/(bDiscriminator(''pfDeepFlavourJetTags:probc'')+bDiscriminator(''pfDeepFlavourJetTags:probuds'')+bDiscriminator(''pfDeepFlavourJetTags:probg'')):-1'}
      - {name: btagDeepFlavCvB, type: float, precision: 10, mcOnly: false, doc: 'DeepJet c vs b+bb+lepb',
         expr: '?(bDiscriminator(''pfDeepFlavourJetTags:probc'')+bDiscriminator(''pfDeepFlavourJetTags:probb'')+bDiscriminator(''pfDeepFlavourJetTags:probbb'')+bDiscriminator(''pfDeepFlavourJetTags:problepb''))>0?bDiscriminator(''pfDeepFlavourJetTags:probc'')/(bDiscriminator(''pfDeepFlavourJetTags:probc'')+bDiscriminator(''pfDeepFlavourJetTags:probb'')+bDiscriminator(''pfDeepFlavourJetTags:probbb'')+bDiscriminator(''pfDeepFlavourJetTags:problepb'')):-1'}
      - {name: btagDeepFlavQG, type: float, precision: 10, mcOnly: false, doc: 'DeepJet g vs uds',
         expr: '?(bDiscriminator(''pfDeepFlavourJetTags:probg'')+bDiscriminator(''pfDeepFlavourJetTags:probuds''))>0?bDiscriminator(''pfDeepFlavourJetTags:probg'')/(bDiscriminator(''pfDeepFlavourJetTags:probg'')+bDiscriminator(''pfDeepFlavourJetTags:probuds'')):-1'}
      - {name: btagPNetB, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet b vs udscg',
         expr: '?bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiCentralDiscriminatorsJetTags:BvsAll'')>0?bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiCentralDiscriminatorsJetTags:BvsAll''):-1'}
      - {name: btagPNetCvL, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet c vs udsg',
         expr: '?bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiCentralDiscriminatorsJetTags:CvsL'')>0?bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiCentralDiscriminatorsJetTags:CvsL''):-1'}
      - {name: btagPNetCvB, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet c vs b',
         expr: '?bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiCentralDiscriminatorsJetTags:CvsB'')>0?bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiCentralDiscriminatorsJetTags:CvsB''):-1'}
      - {name: btagPNetTauVJet, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet tau vs jet',
         expr: '?bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiCentralDiscriminatorsJetTags:TauVsJet'')>0?bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiCentralDiscriminatorsJetTags:TauVsJet''):-1'}
      - {name: btagPNetQvG, type: float, precision: 10, mcOnly: false, doc: 'ParticleNet q vs g',
         expr: '?abs(eta())<2.5?bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiCentralDiscriminatorsJetTags:QvsG''):bDiscriminator(''pfParticleNetFromMiniAODAK4PuppiForwardDiscriminatorsJetTags:QvsG'')'}
      - {name: btagRobustParTAK4B, type: float, precision: 10, mcOnly: false, doc: 'RobustParT b vs udscg',
         expr: '?bDiscriminator(''pfParticleTransformerAK4DiscriminatorsJetTags:BvsAll'')>0?bDiscriminator(''pfParticleTransformerAK4DiscriminatorsJetTags:BvsAll''):-1'}
      - {name: btagRobustParTAK4CvL, type: float, precision: 10, mcOnly: false, doc: 'RobustParT c vs udsg',
         expr: '?bDiscriminator(''pfParticleTransformerAK4DiscriminatorsJetTags:CvsL'')>0?bDiscriminator(''pfParticleTransformerAK4DiscriminatorsJetTags:CvsL''):-1'}
      - {name: btagRobustParTAK4CvB, type: float, precision: 10, mcOnly: false, doc: 'RobustParT c vs b',
         expr: '?bDiscriminator(''pfParticleTransformerAK4DiscriminatorsJetTags:CvsB'')>0?bDiscriminator(''pfParticleTransformerAK4DiscriminatorsJetTags:CvsB''):-1'}
      - {name: btagRobustParTAK4QG, type: float, precision: 10, mcOnly: false, doc: 'RobustParT q vs g',
         expr: '?bDiscriminator(''pfParticleTransformerAK4DiscriminatorsJetTags:QvsG'')>0?bDiscriminator(''pfParticleTransformerAK4DiscriminatorsJetTags:QvsG''):-1'}
      - {name: chHEF, type: float, precision: 10, mcOnly: false, doc: 'charged hadron energy fraction',
         expr: 'chargedHadronEnergyFraction()'}
      - {name: neHEF, type: float, precision: 10, mcOnly: false, doc: 'neutral hadron energy fraction',
         expr: 'neutralHadronEnergyFraction()'}
      - {name: chEmEF, type: float, precision: 10, mcOnly: false, doc: 'charged EM energy fraction',
         expr: 'chargedEmEnergyFraction()'}
      - {name: neEmEF, type: float, precision: 10, mcOnly: false, doc: 'neutral EM energy fraction',
         expr: 'neutralEmEnergyFraction()'}
      - {name: muEF, type: float, precision: 10, mcOnly: false, doc: 'muon energy fraction',
         expr: 'muonEnergyFraction()'}
      - {name: nConstituents, type: uint8, precision: -1, mcOnly: false, doc: 'number of constituents',
         expr: 'numberOfDaughters()'}
      - {name: hadronFlavour, type: uint8, precision: -1, mcOnly: true, doc: 'hadron flavour (ghost tagging)',
         expr: 'hadronFlavour()'}
      - {name: partonFlavour, type: int16, precision: -1, mcOnly: true, doc: 'parton flavour',
         expr: 'partonFlavour()'}
