        extraVariables:          # nominal table only, pat-mode reco jets: columns from the source pat::Jet (NanoAODv12 FatJet set)
          - {name: jecPt, type: float, precision: -1, mcOnly: false, doc: 'pt with the MiniAOD JEC, before JER smearing',
