          - {name: globalParT3_withMassZvsQCD, type: float, precision: 10, mcOnly: false, doc: 'GlobalParT-3 tagger (w/mass) Z vs QCD discriminator',
             expr: 'bDiscriminator(''pfGlobalParticleTransformerAK8JetTags:probWithMassZvsQCD'')'}
      table:
        name: RecoJet
