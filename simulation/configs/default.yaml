# boostedV EEC analysis configuration: every physics setting of eecNano_cfg.py lives here.
# Validated against analysis.schema.yaml by analysisConfig.py: unknown or missing keys are errors.
# Per-job settings (input/output files, maxEvents, isMC, writeConstituents) are cmsRun arguments instead.
# Values marked "placeholder" are invented for development and are not CMS recommendations.

inputs:                      # MiniAOD collection labels
  muons: slimmedMuons
  electrons: slimmedElectrons
  photons: slimmedPhotons
  pfCandidates: packedPFCandidates   # photons for reco lepton dressing
  met: slimmedMETsPuppi
  vertices: offlineSlimmedPrimaryVertices
  genEventInfo: generator    # MC only; event weights for the aggregators
  hltProcess: HLT
  metFilterProcess: PAT      # process holding the Flag_* MET-filter paths
  prunedGenParticles: prunedGenParticles     # MC only; input to the Rivet particle level
  packedGenParticles: packedGenParticles

selection:
  # Levels whose selections define a selected event: [reco], [gen] or [reco, gen] (the OR). Events passing any
  # enabled level are written, with all observables. In MC both levels are always evaluated and their flags
  # stored; in data only reco exists.
  levels: [reco, gen]

  reco:
    vertex: {ndofMin: 4.0, absZMax: 24.0, rhoMax: 2.0}   # first PV must pass
    metFilters:                # all must pass (Run-3 list)
      - Flag_goodVertices
      - Flag_globalSuperTightHalo2016Filter
      - Flag_EcalDeadCellTriggerPrimitiveFilter
      - Flag_BadPFMuonFilter
      - Flag_BadPFMuonDzFilter
      - Flag_hfNoisyHitsFilter
      - Flag_eeBadScFilter
      - Flag_ecalBadCalibFilter

    # Reco lepton dressing (photons added to muon and electron momenta):
    #   none  no dressing (the `objects` cut is the whole selection; every dressedCut must be "")
    #   fsr   CMSSW LeptonFSRProducer (as for NanoAOD FsrPhoton): at most one isolated PF photon per lepton,
    #         outside electron footprints, with dR/ET^2 below deltaROverEt2Max
    #   cone  Rivet-like: every PF photon within coneSize of the nearest lepton, outside electron footprints
    # With dressing, `cut` selects the leptons before dressing and `dressedCut` (a candidate cut on the dressed
    # four-vector) after it; move the pt/eta cuts to dressedCut to mirror the gen level. Isolation is not
    # recomputed: PFIso still counts the dressing photons.
    # MUO POG Run-3 muon momentum corrections ("MuonScaRe", Z-peak method, CMS-DP-2024-065): scale in data and MC,
    # resolution smearing in MC, for lowPtThreshold <= pt <= highPtThreshold (other muons are unchanged). Applied
    # before every muon selection. The smearing random number depends only on the event number, as in the POG code.
    muonCorrections:
      apply: false
      correctionFile: /cvmfs/cms.cern.ch/rsync/cms-nanoAOD/jsonpog-integration/POG/MUO/2022_Summer22EE/muon_scalesmearing.json.gz
      lowPtThreshold: 26.0
      highPtThreshold: 200.0   # stated validity; the POG C++ example corrects the scale at all pt above lowPtThreshold
      variation: nominal       # MC only: nominal | scaleUp | scaleDown | resolutionUp | resolutionDown
      # TODO clarify with the MUO POG: the k in the resolution variation differs between the POG references
      # (cpp: sqrt(k_data^2 - k_mc^2) as in MuonScaRe.cc; python: k_mc as in MuonScaRe.py).
      resolutionVariationK: cpp

    dressing:
      mode: none
      fsr: {muonPtMin: 3.0, muonEtaMax: 2.4, elePtMin: 5.0, eleEtaMax: 2.5, photonPtMin: 2.0,
            deltaROverEt2Max: 0.05, isolation: 2.0}
      cone: {coneSize: 0.1, photonPtMin: 0.0, applyPuppiWeights: true}

    objects:                   # PAT string cuts; source is one of muons, electrons, photons
      tightMuons:
        source: muons
        cut: "pt > 15 && abs(eta) < 2.4 && passed('CutBasedIdTight') && passed('PFIsoTight')"
        dressedCut: ""
      vetoMuons:
        source: muons
        cut: "pt > 10 && abs(eta) < 2.4 && passed('CutBasedIdLoose') && passed('PFIsoLoose')"
        dressedCut: ""
      tightElectrons:
        source: electrons
        cut: "pt > 15 && abs(superCluster().eta()) < 2.5 && (abs(superCluster().eta()) < 1.4442 || abs(superCluster().eta()) > 1.566) && electronID('cutBasedElectronID-RunIIIWinter22-V1-tight') > 0.5"
        dressedCut: ""
      vetoElectrons:
        source: electrons
        cut: "pt > 10 && abs(superCluster().eta()) < 2.5 && (abs(superCluster().eta()) < 1.4442 || abs(superCluster().eta()) > 1.566) && electronID('cutBasedElectronID-RunIIIWinter22-V1-veto') > 0.5"
        dressedCut: ""
      tightPhotons:
        source: photons
        cut: "pt > 220 && abs(superCluster().eta()) < 1.4442 && photonID('cutBasedPhotonID-RunIIIWinter22-122X-V1-tight') > 0.5"
        dressedCut: ""

    # Channel types:
    #   dilepton      OS pair from `objects` closest to targetMass within [massMin, massMax]
    #   leptonMET     exactly one `objects` lepton above ptMin, no other lepton in `vetoes`, MET and mT cuts
    #   singleObject  nMin <= N(objects) <= nMax and all `vetoes` empty
    channels:
      Zmumu:
        type: dilepton
        triggers: ['HLT_IsoMu24_v*']
        allowMissingTriggers: false
        objects: tightMuons
        leadPtMin: 26.0
        subleadPtMin: 15.0
        massMin: 71.0
        massMax: 111.0
        oppositeCharge: true
        targetMass: 91.1876
      Zee:
        type: dilepton
        triggers: ['HLT_Ele32_WPTight_Gsf_v*']
        allowMissingTriggers: false
        objects: tightElectrons
        leadPtMin: 35.0
        subleadPtMin: 15.0
        massMin: 71.0
        massMax: 111.0
        oppositeCharge: true
        targetMass: 91.1876
      Wmunu:
        type: leptonMET
        triggers: ['HLT_IsoMu24_v*']
        allowMissingTriggers: false
        objects: tightMuons
        vetoes: [vetoMuons, vetoElectrons]
        ptMin: 30.0
        metMin: 40.0
        mtMin: 50.0
      Wenu:
        type: leptonMET
        triggers: ['HLT_Ele32_WPTight_Gsf_v*']
        allowMissingTriggers: false
        objects: tightElectrons
        vetoes: [vetoMuons, vetoElectrons]
        ptMin: 35.0
        metMin: 40.0
        mtMin: 50.0
      Hadronic:                # no leptons, no tight photon; jet requirements are in `jets`
        type: singleObject
        triggers: ['HLT_AK8PFJet500_v*', 'HLT_PFHT1050_v*']
        allowMissingTriggers: false
        objects: tightPhotons
        vetoes: [vetoMuons, vetoElectrons]
        nMin: 0
        nMax: 0
      GammaJets:
        type: singleObject
        triggers: ['HLT_Photon200_v*']
        allowMissingTriggers: false
        objects: tightPhotons
        vetoes: [vetoMuons, vetoElectrons]
        nMin: 1
        nMax: 1

  # Generator level (MC only): Rivet particle-level objects, i.e. prompt final-state leptons dressed with photons,
  # isolated prompt photons, and MET from prompt neutrinos. There are no trigger, vertex, MET-filter, ID or isolation
  # requirements; the kinematic cuts mirror the reco ones.
  gen:
    particleLevel:           # ParticleLevelProducer settings, as in NanoAOD's particle level
      usePromptFinalStates: true
      particleMinPt: 0.0
      particleMaxEta: 5.0
      lepConeSize: 0.1       # photon dressing cone
      lepMinPt: 1.0
      lepMaxEta: 2.5
      phoIsoConeSize: 0.4
      phoMaxRelIso: 0.5
      phoMinPt: 1.0
      phoMaxEta: 2.5
    objects:                 # candidate string cuts; source is leptons (dressed) or photons
      genTightMuons:
        source: leptons
        cut: "abs(pdgId) == 13 && pt > 15 && abs(eta) < 2.4"
      genVetoMuons:
        source: leptons
        cut: "abs(pdgId) == 13 && pt > 10 && abs(eta) < 2.4"
      genTightElectrons:
        source: leptons
        cut: "abs(pdgId) == 11 && pt > 15 && abs(eta) < 2.5 && (abs(eta) < 1.4442 || abs(eta) > 1.566)"
      genVetoElectrons:
        source: leptons
        cut: "abs(pdgId) == 11 && pt > 10 && abs(eta) < 2.5 && (abs(eta) < 1.4442 || abs(eta) > 1.566)"
      genTightPhotons:
        source: photons
        cut: "pt > 220 && abs(eta) < 1.4442"
    channels:                # same types as reco, without triggers
      Zmumu:
        type: dilepton
        objects: genTightMuons
        leadPtMin: 26.0
        subleadPtMin: 15.0
        massMin: 71.0
        massMax: 111.0
        oppositeCharge: true
        targetMass: 91.1876
      Zee:
        type: dilepton
        objects: genTightElectrons
        leadPtMin: 35.0
        subleadPtMin: 15.0
        massMin: 71.0
        massMax: 111.0
        oppositeCharge: true
        targetMass: 91.1876
      Wmunu:
        type: leptonMET
        objects: genTightMuons
        vetoes: [genVetoMuons, genVetoElectrons]
        ptMin: 30.0
        metMin: 40.0
        mtMin: 50.0
      Wenu:
        type: leptonMET
        objects: genTightElectrons
        vetoes: [genVetoMuons, genVetoElectrons]
        ptMin: 35.0
        metMin: 40.0
        mtMin: 50.0
      Hadronic:
        type: singleObject
        objects: genTightPhotons
        vetoes: [genVetoMuons, genVetoElectrons]
        nMin: 0
        nMax: 0
      GammaJets:
        type: singleObject
        objects: genTightPhotons
        vetoes: [genVetoMuons, genVetoElectrons]
        nMin: 1
        nMax: 1

jets:
  cleaning:                  # jets within cleaningDR of these channels' selected objects are removed;
    channels: [Zmumu, Zee, Wmunu, Wenu, GammaJets]   # reco jets use the reco objects, gen jets the gen objects
  collections:
    Reco:
      level: reco            # reco | gen
      mode: pat              # pat (MiniAOD jets) | recluster (fastjet on candidates)
      mcOnly: false
      src: slimmedJetsAK8
      R: 0.8
      translator:
        ptMin: 180.0         # must exceed 170: slimmedJetsAK8 has no constituents below that
        applyPuppiWeights: true
        puppiValueMap: ''    # '' = pat::PackedCandidate::puppiWeight()
        jetIdVersion: RUN3PUPPIruns2022FGruns2023CD
      jetCuts: {ptMin: 200.0, absEtaMax: 2.4, idMask: 1, minConstituents: 1}   # idMask bit 0 tight, bit 1 tightLepVeto
      constituentCuts: {ptMin: 0.0, chargedOnly: false, keepAbsPdgIds: [], dropAbsPdgIds: [], minPuppiWeight: 0.0}
      cleaningDR: 0.8
      table: {name: RecoJet, precision: -1}
      jerc:                  # MC only: nominal JER smearing and the JES/JER variations
        correctionFile: /cvmfs/cms.cern.ch/rsync/cms-nanoAOD/jsonpog-integration/POG/JME/2022_Summer22EE/fatJet_jerc.json.gz
        jesKey: Summer22EE_22Sep2023_V2_MC_Total_AK8PFPuppi
        jerScaleFactorKey: Summer22EE_22Sep2023_JRV1_MC_ScaleFactor_AK8PFPuppi
        jerResolutionKey: Summer22EE_22Sep2023_JRV1_MC_PtResolution_AK8PFPuppi
        rho: fixedGridRhoFastjetAll
        genJets: slimmedGenJetsAK8
        jerSeedSalt: 0
      variations:            # MC only. Types: jes, jer {direction}; constScale {categories, scale};
                             # constDrop {categories, dropProbability, seedSalt}; cuts {jetCuts, constituentCuts}
        JESUp: {type: jes, direction: up}
        JESDown: {type: jes, direction: down}
        JERUp: {type: jer, direction: up}
        JERDown: {type: jer, direction: down}
        # placeholder sizes; the drop's seedSalt differs from jerSeedSalt so their random numbers are independent
        TrkDrop: {type: constDrop, categories: [chargedHadron], dropProbability: 0.02, seedSalt: 1}
        ChargedScaleUp: {type: constScale, categories: [chargedHadron], scale: 1.01}
        ChargedScaleDown: {type: constScale, categories: [chargedHadron], scale: 0.99}
        NeutralScaleUp: {type: constScale, categories: [neutralHadron], scale: 1.05}
        NeutralScaleDown: {type: constScale, categories: [neutralHadron], scale: 0.95}
        PhotonScaleUp: {type: constScale, categories: [photon], scale: 1.02}
        PhotonScaleDown: {type: constScale, categories: [photon], scale: 0.98}
    Gen:
      level: gen
      mode: pat
      mcOnly: true
      src: slimmedGenJetsAK8
      R: 0.8
      translator: {ptMin: 180.0}
      jetCuts: {ptMin: 200.0, absEtaMax: 2.4, idMask: 0, minConstituents: 1}
      constituentCuts: {ptMin: 0.0, chargedOnly: false, keepAbsPdgIds: [], dropAbsPdgIds: [], minPuppiWeight: 0.0}
      cleaningDR: 0.8
      table: {name: GenJet, precision: -1}

# Computed for every jet collection and variation; NANO tables are named <Collection><Variation><observable>.
observables:
  E2C:
    kind: penc
    N: 2
    n: 1.0
    weight: Pt               # Energy | Pt
    angle: DeltaR            # DeltaR | Angle3D
    norm: sumPt              # sumE | sumPt | jetE | jetPt | unity
    output: SparseMerged     # Dense | SparseMerged | SparseUnmerged | Unbinned
    axes: [{type: log, nbins: 50, lo: 0.001, hi: 1.0}]
    table: {weightPrecision: -1}
  E3C:
    kind: penc
    N: 3
    n: 1.0
    weight: Pt
    angle: DeltaR
    norm: sumPt
    output: SparseMerged
    axes: [{type: log, nbins: 50, lo: 0.001, hi: 1.0}]
    table: {weightPrecision: -1}
  E1C:
    kind: e1c
    n: 1.0
    weight: Pt
    frame: jetHelicity       # lab | jetHelicity | jetCS
    norm: sumPt
    output: SparseMerged
    axes:
      - {type: regular, nbins: 20, lo: 0.0, hi: 3.141592653589793}
      - {type: regular, nbins: 20, lo: -3.141592653589793, hi: 3.141592653589793}
    table: {weightPrecision: -1}

aggregation:                 # histograms with covariance, written to histFile
  channels: [Zmumu, Zee]     # one set per channel and enabled level, filled from events passing that channel at that
                             # level, for every jet collection: <channel>_<level>_eec<Collection><Variation><observable>
  observables: [E2C, E3C, E1C]
  maxBins: 5000              # memory guard for the covariance

output:
  keepHLTBits: true
  mcEventTables: true        # genWeights (Runs-tree sums), Pileup, Generator
